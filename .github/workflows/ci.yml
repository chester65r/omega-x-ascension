name: CI

# CI validates the production tree on every main push.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omega-x-ascension
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run tests
        run: pytest -q

      - name: Build production image
        working-directory: .
        run: docker build -t omega-x-ascension:ci omega-x-ascension

      - name: Import application from production image
        working-directory: .
        run: docker run --rm omega-x-ascension:ci python -c "from omega.main import app; print(app.title)"

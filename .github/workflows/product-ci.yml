name: Omega X product checks

on:
  push:
    paths:
      - 'product/**'
      - '.github/workflows/product-ci.yml'
  pull_request:
    paths:
      - 'product/**'
      - '.github/workflows/product-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: product/backend/pyproject.toml
      - run: pip install -e '.[test]'
        working-directory: product/backend
      - run: pytest -q
        working-directory: product/backend

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/mobile/package-lock.json
      - run: npm ci
        working-directory: product/mobile
      - run: npm run typecheck
        working-directory: product/mobile
      - name: Validate installable APK profile
        working-directory: product/mobile
        run: node -e "const c=require('./eas.json'); if(c.build.preview.android.buildType!=='apk') process.exit(1); console.log('preview emits APK')"

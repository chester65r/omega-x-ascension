name: Android APK Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "omega-x-ascension/static/**"
      - ".github/workflows/android-release.yml"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-apk:
    name: Build installable debug APK
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare bundled dashboard assets and build debug APK
        run: ./android/build-apk.sh

      - name: Verify APK package and debug signature
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -n 1)"
          test -n "$APP_VERSION"
          APK="omega-x-ascension-$APP_VERSION-debug.apk"
          test -s "$APK"
          BADGING="$( "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" )"
          grep -F "versionCode='10' versionName='$APP_VERSION'" <<< "$BADGING"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.omega.ascension.android15test'"
          sha256sum "$APK" > "$APK.sha256"
          ls -lh "$APK" "$APK.sha256"

      - name: Upload directly downloadable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: omega-x-ascension-android-debug-apk
          path: omega-x-ascension-*-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK checksum
        uses: actions/upload-artifact@v7
        with:
          name: omega-x-ascension-android-debug-checksum
          path: omega-x-ascension-*-debug.apk.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

  signed-release:
    name: Build, test and publish signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Validate and materialize private release signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required repository secret is missing: $name" >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/omega-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/omega-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/omega-signing/release.jks"
          test -s "$RUNNER_TEMP/omega-signing/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/omega-signing/release.jks" >> "$GITHUB_ENV"

      - name: Prepare bundled dashboard assets
        run: ./android/build-apk.sh

      - name: Build signed release APK
        run: ./android/gradlew -p android assembleRelease --no-daemon --stacktrace

      - name: Verify release signature, package identity and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.omega.ascension'"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -p 4 "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Run release UI smoke tests on Android 14 emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./android/gradlew -p android connectedReleaseAndroidTest --no-daemon --stacktrace

      - name: Publish signed APK as a GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          generate_release_notes: true

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: omega-x-ascension-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload release UI test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-x-ascension-android-release-test-diagnostics
          path: |
            android/app/build/reports/androidTests/connected/release/
            android/app/build/outputs/androidTest-results/connected/release/
          if-no-files-found: warn
          retention-days: 7

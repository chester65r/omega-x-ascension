name: Android APK Build and Release

on:
  workflow_dispatch:
    inputs:
      publish_production:
        description: "Build and publish the signed production APK (requires ANDROID_RELEASE_SIGNING_BUNDLE secret)"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Production release tag"
        required: false
        type: string
        default: "v0.8.5"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "omega-x-ascension/static/**"
      - ".github/workflows/android-release.yml"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-apk:
    name: Build installable debug APK
    if: (github.event_name == 'workflow_dispatch' && !inputs.publish_production) || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare bundled dashboard assets and build debug APK
        run: ./android/build-apk.sh

      - name: Verify APK package and debug signature
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -n 1)"
          test -n "$APP_VERSION"
          APK="omega-x-ascension-$APP_VERSION-debug.apk"
          test -s "$APK"
          BADGING="$( "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" )"
          APP_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' android/app/build.gradle | head -n 1)"
          test -n "$APP_CODE"
          grep -F "versionCode='$APP_CODE' versionName='$APP_VERSION'" <<< "$BADGING"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.omega.ascension.android15test'"
          sha256sum "$APK" > "$APK.sha256"
          ls -lh "$APK" "$APK.sha256"

      - name: Upload directly downloadable debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omega-x-ascension-android-debug-apk
          path: omega-x-ascension-*-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omega-x-ascension-android-debug-checksum
          path: omega-x-ascension-*-debug.apk.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Compute debug release tag
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -n 1)"
          test -n "$APP_VERSION"
          echo "DEBUG_RELEASE_TAG=debug-v${APP_VERSION}" >> "$GITHUB_ENV"

      - name: Publish installable debug APK to GitHub Releases
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: ${{ env.DEBUG_RELEASE_TAG }}
          name: OMEGA-X Ascension ${{ env.DEBUG_RELEASE_TAG }} (debug APK)
          body: |
            Directly installable, debug-signed APK built from main.
            - Package: com.omega.ascension.android15test (debug suffix is intentional)
            - Signature and package identity verified with apksigner and aapt; sha256 checksum in the .sha256 file.
            - Install: allow "install unknown apps" for your browser or file manager, then open the .apk on Android 8+.
          prerelease: true
          files: |
            omega-x-ascension-*-debug.apk
            omega-x-ascension-*-debug.apk.sha256

  signed-release:
    name: Build, test and publish signed release APK
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_production)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_RELEASE_SIGNING_BUNDLE: ${{ secrets.ANDROID_RELEASE_SIGNING_BUNDLE }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate and materialize private release signing key
        shell: bash
        env:
          ANDROID_RELEASE_SIGNING_BUNDLE: ${{ secrets.ANDROID_RELEASE_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_RELEASE_SIGNING_BUNDLE:-}" ]]; then
            echo "Required repository secret is missing: ANDROID_RELEASE_SIGNING_BUNDLE" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/omega-signing"
          python3 - "$RUNNER_TEMP/omega-signing/release.jks" "$GITHUB_ENV" <<'PY'
          import base64, binascii, json, os, sys
          keystore_path, env_path = sys.argv[1:]
          supplied = os.environ.get("ANDROID_RELEASE_SIGNING_BUNDLE", "")
          stripped = supplied.strip()
          if not stripped:
              raise SystemExit("Required repository secret is missing: ANDROID_RELEASE_SIGNING_BUNDLE")
          if stripped.startswith("{"):
              payload = stripped.encode("utf-8")
          else:
              compact = "".join(stripped.split()).replace("-", "+").replace("_", "/")
              compact += "=" * ((-len(compact)) % 4)
              try:
                  payload = base64.b64decode(compact, validate=True)
              except (binascii.Error, ValueError):
                  raise SystemExit(
                      "ANDROID_RELEASE_SIGNING_BUNDLE is not valid Base64. "
                      "Re-copy the complete one-line contents of "
                      "OMEGA_X_ANDROID_RELEASE_SIGNING_SECRET.txt into the GitHub secret "
                      "without adding quotes or extra text."
                  )
          try:
              bundle = json.loads(payload.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError):
              raise SystemExit(
                  "ANDROID_RELEASE_SIGNING_BUNDLE must decode to a JSON signing bundle. "
                  "Copy the complete secret-file contents; do not paste an individual password."
              )
          required = ("keystoreBase64", "storePassword", "keyAlias", "keyPassword")
          if not isinstance(bundle, dict) or any(
              not isinstance(bundle.get(key), str) or not bundle[key] for key in required
          ):
              raise SystemExit("Signing bundle is incomplete; required fields are missing.")
          if any("\n" in bundle[key] or "\r" in bundle[key] for key in required):
              raise SystemExit("Signing bundle fields must not contain line breaks.")
          try:
              key_data = base64.b64decode("".join(bundle["keystoreBase64"].split()), validate=True)
          except (binascii.Error, ValueError):
              raise SystemExit("The signing bundle's keystoreBase64 field is malformed.")
          if len(key_data) < 1000:
              raise SystemExit("Signing keystore is invalid or empty.")
          with open(keystore_path, "wb") as handle:
              handle.write(key_data)
          with open(env_path, "a", encoding="utf-8") as handle:
              handle.write(f"ANDROID_KEYSTORE_FILE={keystore_path}\n")
              handle.write(f"ANDROID_KEYSTORE_PASSWORD={bundle['storePassword']}\n")
              handle.write(f"ANDROID_KEY_ALIAS={bundle['keyAlias']}\n")
              handle.write(f"ANDROID_KEY_PASSWORD={bundle['keyPassword']}\n")
          os.chmod(keystore_path, 0o600)
          PY
          test -s "$RUNNER_TEMP/omega-signing/release.jks"

      - name: Prepare bundled dashboard assets
        run: ./android/build-apk.sh

      - name: Build signed release APK
        run: ./android/gradlew -p android assembleRelease --no-daemon --stacktrace

      - name: Verify release signature, package identity and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.omega.ascension'"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run release UI smoke tests on Android 14 emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./android/gradlew -p android connectedReleaseAndroidTest --no-daemon --stacktrace

      - name: Publish signed APK as a GitHub Release asset
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_production && inputs.release_tag || github.ref_name }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          generate_release_notes: true

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omega-x-ascension-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload release UI test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-x-ascension-android-release-test-diagnostics
          path: |
            android/app/build/reports/androidTests/connected/release/
            android/app/build/outputs/androidTest-results/connected/release/
          if-no-files-found: warn
          retention-days: 7

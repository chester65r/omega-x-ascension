name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Validate and materialize private release signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required repository secret is missing: $name" >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/omega-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/omega-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/omega-signing/release.jks"
          test -s "$RUNNER_TEMP/omega-signing/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/omega-signing/release.jks" >> "$GITHUB_ENV"

      - name: Prepare bundled dashboard assets
        run: ./android/build-apk.sh

      - name: Build release APK
        run: ./android/gradlew -p android assembleRelease --no-daemon --stacktrace

      - name: Verify release signature and package identity
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.omega.ascension'"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -p 4 "$APK"

      - name: Run release-variant UI smoke tests on Android 14 emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./android/gradlew -p android connectedReleaseAndroidTest --no-daemon --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: omega-x-ascension-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release UI test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-x-ascension-android-release-test-diagnostics
          path: |
            android/app/build/reports/androidTests/connected/release/
            android/app/build/outputs/androidTest-results/connected/release/
          if-no-files-found: warn
          retention-days: 7

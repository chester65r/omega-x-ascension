name: Retire redundant Render API service

# Manual-only, narrowly scoped retirement. Never targets Render PostgreSQL or Key Value.
# Before running, add the Render API key as the repository Actions secret RENDER_API_KEY.
on:
  workflow_dispatch:
    inputs:
      confirm_service_id:
        description: "Type the exact Render service ID shown below."
        required: true
        type: string
      confirm_service_name:
        description: "Type the exact Render service name shown below."
        required: true
        type: string
      confirmation_phrase:
        description: 'Type exactly: DELETE omega-x-ascension-api ONLY'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: retire-render-api-service
  cancel-in-progress: false

jobs:
  retire:
    name: Verify target, delete only the API service, and verify stores remain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard, preflight, retire exact service, and verify preservation
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CONFIRM_SERVICE_ID: ${{ inputs.confirm_service_id }}
          CONFIRM_SERVICE_NAME: ${{ inputs.confirm_service_name }}
          CONFIRMATION_PHRASE: ${{ inputs.confirmation_phrase }}
        run: |
          set -euo pipefail

          readonly TARGET_SERVICE_ID="srv-db536tqjnfac73930qe0"
          readonly TARGET_SERVICE_NAME="omega-x-ascension-api"
          readonly EXPECTED_WORKSPACE_ID="tea-dar8f4142hec73dcoot0"
          readonly TARGET_POSTGRES_ID="dpg-db518h0473hc739golpg-a"
          readonly TARGET_POSTGRES_NAME="omega-x-ascension-db"
          readonly TARGET_KEY_VALUE_ID="red-db518ip42hec73fbrcb0"
          readonly TARGET_KEY_VALUE_NAME="omega-x-ascension-kv"
          readonly API_BASE="https://api.render.com/v1"
          readonly WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          # User inputs are confirmations only; they can never select a different resource.
          [[ "$CONFIRM_SERVICE_ID" == "$TARGET_SERVICE_ID" ]] || {
            echo "::error::Service ID confirmation did not match the fixed target. Nothing was changed."
            exit 1
          }
          [[ "$CONFIRM_SERVICE_NAME" == "$TARGET_SERVICE_NAME" ]] || {
            echo "::error::Service name confirmation did not match the fixed target. Nothing was changed."
            exit 1
          }
          [[ "$CONFIRMATION_PHRASE" == "DELETE omega-x-ascension-api ONLY" ]] || {
            echo "::error::Confirmation phrase did not match. Nothing was changed."
            exit 1
          }
          [[ -n "${RENDER_API_KEY:-}" ]] || {
            echo "::error::Missing repository Actions secret RENDER_API_KEY. Nothing was changed."
            exit 1
          }

          api_request() {
            local method="$1"
            local url="$2"
            local output="$3"
            curl --connect-timeout 10 --max-time 25 --silent --show-error \
              --output "$output" --write-out '%{http_code}' --request "$method" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json" "$url"
          }

          verify_datastores() {
            local phase="$1"
            local pg_file="$WORK_DIR/postgres-$phase.json"
            local kv_file="$WORK_DIR/key-value-$phase.json"
            local pg_status kv_status

            pg_status="$(api_request GET "$API_BASE/postgres/$TARGET_POSTGRES_ID" "$pg_file")"
            [[ "$pg_status" == "200" ]] || {
              echo "::error::PostgreSQL preservation check ($phase) returned HTTP $pg_status. No datastore deletion was requested by this workflow."
              exit 1
            }
            jq -e --arg id "$TARGET_POSTGRES_ID" --arg name "$TARGET_POSTGRES_NAME" \
              '.id == $id and .name == $name and .status == "available"' "$pg_file" >/dev/null || {
                echo "::error::PostgreSQL identity/status check ($phase) failed. No datastore deletion was requested by this workflow."
                exit 1
              }

            kv_status="$(api_request GET "$API_BASE/key-value/$TARGET_KEY_VALUE_ID" "$kv_file")"
            [[ "$kv_status" == "200" ]] || {
              echo "::error::Key Value preservation check ($phase) returned HTTP $kv_status. No datastore deletion was requested by this workflow."
              exit 1
            }
            jq -e --arg id "$TARGET_KEY_VALUE_ID" --arg name "$TARGET_KEY_VALUE_NAME" \
              '.id == $id and .name == $name and .status == "available"' "$kv_file" >/dev/null || {
                echo "::error::Key Value identity/status check ($phase) failed. No datastore deletion was requested by this workflow."
                exit 1
              }

            echo "PostgreSQL and Key Value identity/status verified ($phase); neither resource is a deletion target."
          }

          # Delete only after the canonical Railway production API is reachable and ready.
          # These checks prevent retirement during an unnoticed production outage.
          readonly RAILWAY_BASE_URL="https://omega-api-production-e4ed.up.railway.app"
          for endpoint in live ready; do
            curl --fail --silent --show-error --connect-timeout 8 --max-time 20 \
              --retry 3 --retry-delay 2 \
              "$RAILWAY_BASE_URL/health/$endpoint" \
              --output "$WORK_DIR/railway-$endpoint.json" || {
                echo "::error::Railway health preflight failed at /health/$endpoint. Nothing was deleted."
                exit 1
              }
          done
          curl --fail --silent --show-error --connect-timeout 8 --max-time 20 \
            --retry 3 --retry-delay 2 "$RAILWAY_BASE_URL/version" \
            --output "$WORK_DIR/railway-version.json" || {
              echo "::error::Railway API version preflight failed at /version. Nothing was deleted."
              exit 1
            }
          jq -e '.status == "ok"' "$WORK_DIR/railway-live.json" >/dev/null || {
            echo "::error::Railway liveness check did not report status=ok. Nothing was deleted."
            exit 1
          }
          jq -e '.status == "ready"' "$WORK_DIR/railway-ready.json" >/dev/null || {
            echo "::error::Railway readiness check did not report status=ready. Nothing was deleted."
            exit 1
          }
          jq -e '.name == "OMEGA-X ASCENSION"' "$WORK_DIR/railway-version.json" >/dev/null || {
            echo "::error::Railway API identity check failed. Nothing was deleted."
            exit 1
          }
          echo "Canonical Railway API health, readiness and identity verified."

          # Confirm the API credential belongs to the expected Render workspace and
          # both separately managed datastores are currently available before deletion.
          service_file="$WORK_DIR/service.json"
          service_status="$(api_request GET "$API_BASE/services/$TARGET_SERVICE_ID" "$service_file")"
          [[ "$service_status" == "200" ]] || {
            echo "::error::Render service preflight returned HTTP $service_status. Nothing was deleted."
            exit 1
          }
          jq -e --arg id "$TARGET_SERVICE_ID" --arg name "$TARGET_SERVICE_NAME" \
            --arg owner "$EXPECTED_WORKSPACE_ID" \
            '.id == $id and .name == $name and .type == "web_service" and .ownerId == $owner' \
            "$service_file" >/dev/null || {
              echo "::error::Service ID/name/type/workspace did not match the exact expected API service. Nothing was deleted."
              exit 1
            }

          verify_datastores "before-delete"

          echo "Preflight passed for the exact Render web service. Sending a delete request for that service ID only."
          delete_status="$(api_request DELETE "$API_BASE/services/$TARGET_SERVICE_ID" "$WORK_DIR/delete-response.txt")"
          [[ "$delete_status" == "204" ]] || {
            echo "::error::Render delete request returned HTTP $delete_status. Review the Render dashboard before retrying."
            exit 1
          }

          # Confirm eventual removal by checking the same service ID only.
          removed="false"
          for attempt in 1 2 3 4 5 6; do
            check_status="$(api_request GET "$API_BASE/services/$TARGET_SERVICE_ID" "$WORK_DIR/post-delete-service.json")"
            if [[ "$check_status" == "404" || "$check_status" == "410" ]]; then
              removed="true"
              break
            fi
            if [[ "$check_status" != "200" ]]; then
              echo "::error::Post-delete verification returned unexpected HTTP $check_status. The DELETE request returned 204; review Render manually."
              exit 1
            fi
            sleep 2
          done

          [[ "$removed" == "true" ]] || {
            echo "::error::Render accepted the delete request, but the target was still present after verification attempts."
            exit 1
          }

          verify_datastores "after-delete"
          echo "SUCCESS: the exact Render API web service was removed and verified absent."
          echo "SUCCESS: the original Render PostgreSQL database and Key Value store remain available."

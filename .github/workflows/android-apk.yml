name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "omega-x-ascension/static/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "omega-x-ascension/static/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Termux setup script syntax
        run: bash -n android/setup-local-ai-termux.sh

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: ./android/build-apk.sh


      - name: Validate packaged dashboard assets and navigation policy
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          root = Path(".")
          source = root / "omega-x-ascension" / "static"
          bundle = root / "android" / "app" / "src" / "main" / "assets" / "web"
          html_path = bundle / "index.html"
          assert html_path.is_file(), "Bundled dashboard index.html is missing"
          html = html_path.read_text(encoding="utf-8")
          assert 'src="app.js"' in html, "Bundled HTML must load the local app.js"
          assert 'href="style.css"' in html, "Bundled HTML must load the local style.css"
          assert "/static/" not in html, "Web-only /static/ paths remain in Android HTML"
          assert "serviceWorker.register" not in html, "PWA service-worker registration must be removed from APK"

          for name in ("app.js", "style.css", "icon-192.png", "icon-512.png",
                       "favicon.png", "apple-touch-icon.png"):
              expected = source / name
              actual = bundle / name
              assert expected.is_file() and actual.is_file(), f"Missing dashboard asset: {name}"
              assert expected.read_bytes() == actual.read_bytes(), f"Stale bundled asset: {name}"

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.tab_targets = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  if tag == "button" and "data-tab" in attrs:
                      self.tab_targets.append(attrs["data-tab"])

          parser = IdParser()
          parser.feed(html)
          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          assert not duplicates, f"Duplicate HTML IDs: {duplicates}"
          id_set = set(parser.ids)
          assert all(target in id_set for target in parser.tab_targets), "A dashboard tab points to a missing section"

          java = (root / "android" / "app" / "src" / "main" / "java" /
                  "com" / "omega" / "ascension" / "MainActivity.java").read_text(encoding="utf-8")
          for required in ("request.isForMainFrame()", "isTrustedAppAsset(uri)",
                           "Intent.ACTION_VIEW", "WebViewCompat.addWebMessageListener",
                           "isMainFrame", "sourceOrigin", "startVoiceInput", "shareText",
                           'setAllowFileAccess(false)', 'setAllowContentAccess(false)'):
              assert required in java, f"Android WebView security guard missing: {required}"
          native_browser = (root / "android" / "app" / "src" / "main" / "java" /
                            "com" / "omega" / "ascension" / "BrowserActivity.java").read_text(encoding="utf-8")
          for required in ("setJavaScriptEnabled(true)", "setAllowFileAccess(false)",
                           "setAllowContentAccess(false)", "WebSettings.MIXED_CONTENT_NEVER_ALLOW",
                           "setSafeBrowsingEnabled(true)", "EXTRA_URL"):
              assert required in native_browser, f"Native browser security guard missing: {required}"
          assert "addJavascriptInterface" not in native_browser, "Standalone browser must not expose a JS bridge"
          print(f"Validated {len(parser.ids)} unique dashboard IDs and {6} bundled assets.")
          PY

      - name: Verify APK signature and package
        run: |
          APK=omega-x-ascension-0.8.0-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.omega.ascension'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omega-x-ascension-android-debug
          path: omega-x-ascension-0.8.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run Android emulator UI smoke test
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

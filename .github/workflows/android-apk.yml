name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "omega-x-ascension/static/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "omega-x-ascension/static/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: ./android/build-apk.sh

      - name: Verify APK signature and package
        run: |
          APK=omega-x-ascension-0.5.0-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.omega.ascension'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omega-x-ascension-android-debug
          path: omega-x-ascension-0.5.0-debug.apk
          if-no-files-found: error
          retention-days: 14

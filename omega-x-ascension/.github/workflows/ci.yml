name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: omega-x-ascension/pyproject.toml

      - name: Install package and test dependencies
        working-directory: omega-x-ascension
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Python sources
        working-directory: omega-x-ascension
        run: python -m compileall -q src scripts tests

      - name: Run tests
        working-directory: omega-x-ascension
        run: pytest -q

      - name: Build production image
        run: docker build -t omega-x-ascension:ci omega-x-ascension

      - name: Import application from production image
        run: docker run --rm omega-x-ascension:ci python -c "from omega.main import app; print(app.title)"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "omega-x-ascension"
version = "0.4.0"
description = "Production-oriented autonomous AI orchestration platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "redis>=5.1,<6",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "PyJWT>=2.10,<3",
  "structlog>=24.4,<26",
  "prometheus-client>=0.21,<1",
  "tenacity>=9,<10",
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1", "mypy>=1.13,<2"]
[tool.hatch.build.targets.wheel]
packages = ["src/omega"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

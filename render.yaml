databases:
  - name: omega-x-ascension-db
    databaseName: omega_x_ascension_db
    user: omega_x_ascension_db_user
    plan: free
    region: frankfurt
    postgresMajorVersion: 16

services:
  - type: keyvalue
    name: omega-x-ascension-kv
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: omega-x-ascension-api
    runtime: docker
    repo: https://github.com/chester65r/omega-x-ascension
    branch: main
    region: frankfurt
    plan: free
    dockerContext: ./omega-x-ascension
    dockerfilePath: ./omega-x-ascension/Dockerfile
    dockerCommand: python scripts/render_entrypoint.py
    autoDeploy: true
    healthCheckPath: /health/live
    envVars:
      - key: OMEGA_DB_HOST
        fromDatabase:
          name: omega-x-ascension-db
          property: host
      - key: OMEGA_DB_PORT
        fromDatabase:
          name: omega-x-ascension-db
          property: port
      - key: OMEGA_DB_NAME
        fromDatabase:
          name: omega-x-ascension-db
          property: database
      - key: OMEGA_DB_OWNER_USER
        fromDatabase:
          name: omega-x-ascension-db
          property: user
      - key: OMEGA_DB_OWNER_PASSWORD
        fromDatabase:
          name: omega-x-ascension-db
          property: password
      - key: OMEGA_REDIS_URL
        fromService:
          type: keyvalue
          name: omega-x-ascension-kv
          property: connectionString
      - key: OMEGA_APP_PASSWORD
        generateValue: true
      - key: OMEGA_WORKER_PASSWORD
        generateValue: true
      - key: OMEGA_CHECKPOINT_PASSWORD
        generateValue: true
      - key: OMEGA_JWT_SECRET
        generateValue: true
      - key: OMEGA_OPENAI_API_KEY
        sync: false
      - key: OMEGA_OPENAI_MODEL
        value: gpt-6-astra
      - key: OMEGA_OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OMEGA_OPENAI_PRIORITY
        value: "100"
      - key: OMEGA_HF_INFERENCE_TOKEN
        sync: false
      - key: OMEGA_HF_INFERENCE_MODEL
        value: Qwen/Qwen3-4B:featherless-ai
      - key: OMEGA_HF_INFERENCE_BASE_URL
        value: https://router.huggingface.co/v1
      - key: OMEGA_ENABLE_COMPUTER_EXECUTION
        value: "false"
      - key: OMEGA_ENABLE_COMPUTER_FILES
        value: "false"

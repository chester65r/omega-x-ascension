services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      POSTGRES_USER: omega
      POSTGRES_DB: omega
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./omega-x-ascension/deploy/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omega -d omega"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: on-failure

  redis:
    image: redis:7-alpine
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: on-failure

  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama_data:/root/.ollama"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: on-failure

  ollama-pull:
    image: ollama/ollama:latest
    command: ["pull", "qwen2.5:0.5b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes: ["ollama_data:/root/.ollama"]
    depends_on:
      ollama: {condition: service_healthy}
    restart: "no"

  migrate:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./omega-x-ascension:/app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "pip install --no-cache-dir -e . && python scripts/migrate.py"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./omega-x-ascension:/app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "pip install --no-cache-dir -e . && exec uvicorn omega.main:app --host 0.0.0.0 --port 8000 --reload --app-dir src --proxy-headers"]
    ports: ["3000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      ollama-pull: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  worker:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./omega-x-ascension:/app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "pip install --no-cache-dir -e . && exec python -m omega.worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      ollama-pull: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: on-failure

volumes:
  postgres_data: {}
  redis_data: {}
  ollama_data: {}

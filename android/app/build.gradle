plugins {
    id 'com.android.application'
}

android {
    namespace 'com.omega.ascension'
    compileSdk 35
    // Instrumented tests target the debug variant by default (Android APK workflow and local
    // runs use connectedDebugAndroidTest). The signed release workflow opts in to release-variant
    // instrumentation with -PomegaTestBuildType=release. AGP only generates androidTest tasks for
    // the single configured testBuildType, so a hard-coded "release" removes
    // connectedDebugAndroidTest entirely.
    def requestedTestBuildType = (project.findProperty('omegaTestBuildType') ?: 'debug').toString().trim()
    if (!(requestedTestBuildType in ['debug', 'release'])) {
        throw new GradleException("omegaTestBuildType must be 'debug' or 'release', got '${requestedTestBuildType}'")
    }
    testBuildType requestedTestBuildType

    defaultConfig {
        applicationId "com.omega.ascension"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "0.8.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release builds require an explicitly supplied private key; never fall back to debug signing.
    def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_FILE')
    def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
    def releaseSigningConfigured = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
            .every { value -> value != null && !value.trim().isEmpty() } &&
            new File(releaseKeystorePath ?: '').isFile()

    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        // Debug/APK test builds install beside the production package, avoiding data loss or
        // certificate-mismatch failures when the CI debug keystore changes between runs.
        debug {
            applicationIdSuffix ".android15test"
        }
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.webkit:webkit:1.8.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
}
